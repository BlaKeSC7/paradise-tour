<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      title/description/canonical/robots/OG/Twitter/JSON-LD de cada página se generan
      en tiempo de ejecución con src/components/Seo.tsx (react-helmet-async) — a
      propósito NO se duplican acá, porque Helmet agrega sus tags pero no borra
      los que ya estaban en este HTML estático, y el navegador/crawler puede quedarse
      con el primero (el genérico) en vez del específico de la página.
      Este <title> es solo el que se ve en la fracción de segundo antes de que
      React monte; Seo.tsx lo reemplaza enseguida.
      ⚠️ El dominio real todavía no existe: ver el placeholder documentado en
      src/lib/site-config.ts (también hay que actualizar public/robots.txt y
      scripts/generate-sitemap.mjs cuando se registre uno).
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Paradise Tours</title>
    <meta name="keywords" content="tours, excursiones, punta cana, snorkel, catamarán, turismo, aventura, viajes, reservas de tours, vacaciones paradisíacas" />
    <meta name="author" content="SH COMPUTERS" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    </body>
</html>
